x-common-env: &common-env
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}

x-service-defaults: &service-defaults
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy

x-eureka-defaults: &eureka-service-defaults
  restart: on-failure
  depends_on:
    redis:
      condition: service_healthy

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: farmconnect-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrichain"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (shared state for token store, caching) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: farmconnect-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # ── Discovery ───────────────────────────────────────────────────────────────
  eureka-service:
    <<: *eureka-service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: eureka-service
    container_name: farmconnect-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  # ── Gateway ─────────────────────────────────────────────────────────────────
  gateway-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: gateway-service
    container_name: farmconnect-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      - eureka-service
        condition: service_started
      - postgres
        condition: service_healthy

  # ── Backend Services ────────────────────────────────────────────────────────
  # All internal services register with Eureka and are no longer exposed
  # directly to the host network. Traffic flows through gateway → service.
  identity-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: identity-service
    container_name: farmconnect-identity
    ports:
      - "8081:8081"  # Exposed for debugging/admin; production: remove
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_identity
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      redis:
        condition: service_healthy
      eureka-service:
        condition: service_started
    volumes:
      - farmer_documents:/app/uploads/documents

  farmer-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: farmer-service
    container_name: farmconnect-farmer
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_farmer
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_IDENTITY_URL: http://identity-service:8081
      SERVICES_NOTIFICATION_URL: http://notification-service:8088
      DOCUMENT_STORAGE_DIR: /app/uploads/documents
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started
    volumes:
      - farmer_documents:/app/uploads/documents

  crop-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: crop-service
    container_name: farmconnect-crop
    environment:
      <<: *common-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_crop
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_IDENTITY_URL: http://identity-service:8081
      SERVICES_FARMER_URL: http://farmer-service:8082
      SERVICES_NOTIFICATION_URL: http://notification-service:8088
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started

  transaction-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: transaction-service
    container_name: farmconnect-transaction
    environment:
      <<: *common-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_transaction
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_IDENTITY_URL: http://identity-service:8081
      SERVICES_FARMER_URL: http://farmer-service:8082
      SERVICES_CROP_URL: http://crop-service:8083
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started

  subsidy-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: subsidy-service
    container_name: farmconnect-subsidy
    environment:
      <<: *common-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_subsidy
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_IDENTITY_URL: http://identity-service:8081
      SERVICES_FARMER_URL: http://farmer-service:8082
      SERVICES_TRANSACTION_URL: http://transaction-service:8084
      SERVICES_NOTIFICATION_URL: http://notification-service:8088
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started

  compliance-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: compliance-service
    container_name: farmconnect-compliance
    environment:
      <<: *common-env
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_compliance
      SERVICES_IDENTITY_URL: http://identity-service:8081
      SERVICES_FARMER_URL: http://farmer-service:8082
      SERVICES_TRANSACTION_URL: http://transaction-service:8084
      SERVICES_SUBSIDY_URL: http://subsidy-service:8085
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started

  reporting-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: reporting-service
    container_name: farmconnect-reporting
    environment:
      <<: *common-env
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_reporting
      SERVICES_IDENTITY_URL: http://identity-service:8081
      SERVICES_FARMER_URL: http://farmer-service:8082
      SERVICES_CROP_URL: http://crop-service:8083
      SERVICES_TRANSACTION_URL: http://transaction-service:8084
      SERVICES_SUBSIDY_URL: http://subsidy-service:8085
      SERVICES_COMPLIANCE_URL: http://compliance-service:8086
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started

  notification-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: notification-service
    container_name: farmconnect-notification
    environment:
      <<: *common-env
      SERVER_PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_notification
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_IDENTITY_URL: http://identity-service:8081
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started

  trader-service:
    <<: *service-defaults
    build:
      context: ./backend
      args:
        MODULE_NAME: trader-service
    container_name: farmconnect-trader
    environment:
      <<: *common-env
      SERVER_PORT: 8089
      DB_URL: jdbc:postgresql://postgres:5432/agrichain_trader
      JWT_SECRET: ${JWT_SECRET}
      SERVICES_IDENTITY_URL: http://identity-service:8081
      SERVICES_CROP_URL: http://crop-service:8083
      SERVICES_NOTIFICATION_URL: http://notification-service:8088
      EUREKA_URI: http://eureka-service:8761
    depends_on:
      eureka-service:
        condition: service_started

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: farmconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway-service

volumes:
  postgres_data:
  farmer_documents:
  redis_data: